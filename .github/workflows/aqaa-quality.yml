# The safety net of SchulerPark, written by aqaa from what its QA run found:
# unit tests with coverage and its floor, integration tests against the databases they need, end-to-end tests,
# lint, SAST and dependency audits (report only until the findings are triaged; SARIF goes to code scanning).
# Actions are pinned to commit SHAs (the comment names the release); jobs get read-only tokens.
name: aqaa quality
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks-docker:
    name: Static analysis (docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |-
          T="$(mktemp -d)"
          cd "$T"
          curl -fsSL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64" && echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum -c -
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          cd - > /dev/null
          rm -rf "$T"
      - name: Install dependencies
        run: mkdir -p test-reports
      - name: hadolint (lint, report only)
        run: find . -type f \( -name Dockerfile -o -name 'Dockerfile.*' -o -name '*.Dockerfile' -o -name Containerfile \) -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 -r hadolint
        continue-on-error: true
  unit-dotnet-backend:
    name: Unit tests (dotnet backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          export PATH="$PATH:$HOME/.dotnet/tools" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"
          mkdir -p test-reports
          dotnet restore
          dotnet tool update --global trx2junit --version 2.1.0
      - name: Unit tests
        run: |-
          export PATH="$PATH:$HOME/.dotnet/tools" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"
          if grep -rqsi --include='*.csproj' --include='*.props' --include='*.targets' coverlet.collector .; then c="XPlat Code Coverage"; else c="Code Coverage;Format=cobertura"; fi; dotnet test --no-restore --filter "Category!=Integration&Category!=E2E" --logger "trx;LogFilePrefix=unit" --results-directory test-reports --collect "$c" && trx2junit test-reports/*.trx
      - name: Coverage floor (17%)
        run: python3 "$GITHUB_WORKSPACE/ci/coverage_gate.py" cobertura 'test-reports/**/*.cobertura.xml' 17
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-dotnet-backend
          path: backend/test-reports
          if-no-files-found: ignore
          retention-days: 14
  integration-dotnet-backend:
    name: Integration tests (dotnet backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqaa
          POSTGRES_PASSWORD: aqaa
          POSTGRES_DB: aqaa
        ports: ['5432:5432']
        options: "--health-cmd \"pg_isready -U aqaa -d aqaa\" --health-interval 2s --health-timeout 5s --health-retries 30"
    env:
      AQAA_PG_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_PG_CONNECTION_STRING: Host=localhost;Port=5432;Database=aqaa;Username=aqaa;Password=aqaa
      DATABASE_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_PG_JDBC_URL: jdbc:postgresql://localhost:5432/aqaa?user=aqaa&password=aqaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          export PATH="$PATH:$HOME/.dotnet/tools" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"
          mkdir -p test-reports
          dotnet restore
          dotnet tool update --global trx2junit --version 2.1.0
      - name: Integration tests
        run: |-
          export PATH="$PATH:$HOME/.dotnet/tools" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"
          dotnet test --no-restore --filter "Category=Integration" --logger "trx;LogFilePrefix=integration" --results-directory test-reports && trx2junit test-reports/*.trx
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-dotnet-backend
          path: backend/test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-dotnet-backend:
    name: Static analysis (dotnet backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          export PATH="$PATH:$HOME/.dotnet/tools" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"
          mkdir -p test-reports
          dotnet restore
          dotnet tool update --global trx2junit --version 2.1.0
      - name: dotnet format (lint, report only)
        run: |-
          export PATH="$PATH:$HOME/.dotnet/tools" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"
          dotnet format --verify-no-changes --no-restore
        continue-on-error: true
      - name: roslyn security analyzers (sast, report only)
        run: |-
          export PATH="$PATH:$HOME/.dotnet/tools" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"
          mkdir -p test-reports/roslyn
          cat > "$RUNNER_TEMP_DIR/aqaa-sast.props" <<EOF
          <Project><PropertyGroup><RunAnalyzers>true</RunAnalyzers><AnalysisModeSecurity>All</AnalysisModeSecurity><ErrorLog>$PWD/test-reports/roslyn/\$(MSBuildProjectName).sarif,version=2.1</ErrorLog></PropertyGroup></Project>
          EOF
          dotnet build --no-restore -nologo -p:CustomBeforeMicrosoftCommonProps="$RUNNER_TEMP_DIR/aqaa-sast.props" -p:TreatWarningsAsErrors=false
        continue-on-error: true
      - if: always() && hashFiles('backend/test-reports/roslyn') != ''
        continue-on-error: true
        name: Upload roslyn security analyzers findings to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: backend/test-reports/roslyn
          category: roslyn-security-analyzers-dotnet-backend
      - name: vulnerable packages (dependency, report only)
        run: |-
          export PATH="$PATH:$HOME/.dotnet/tools" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 RUNNER_TEMP_DIR="${RUNNER_TEMP:-${WORKSPACE_TMP:-/tmp}}"
          dotnet list package --vulnerable --include-transitive | tee test-reports/vulnerable.txt && ! grep -q "has the following vulnerable packages" test-reports/vulnerable.txt
        continue-on-error: true
  e2e-node-e2e:
    name: End-to-end tests (node e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies
        run: |-
          mkdir -p test-reports
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-reports/e2e.xml npx playwright test --reporter=junit,list
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-node-e2e
          path: e2e/test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-node-e2e:
    name: Static analysis (node e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies
        run: |-
          mkdir -p test-reports
          npm ci
      - name: eslint (lint, report only)
        run: if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then npx eslint .; else echo 'no ESLint configuration'; fi
        continue-on-error: true
      - name: npm audit (dependency, report only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
  unit-shell:
    name: Unit tests (shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |-
          T="$(mktemp -d)"
          cd "$T"
          curl -fsSL -o bats.tgz "https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz" && echo "bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177  bats.tgz" | sha256sum -c -
          curl -fsSL -o support.tgz "https://github.com/bats-core/bats-support/archive/refs/tags/v0.3.0.tar.gz" && echo "7815237aafeb42ddcc1b8c698fc5808026d33317d8701d5ec2396e9634e2918f  support.tgz" | sha256sum -c -
          curl -fsSL -o assert.tgz "https://github.com/bats-core/bats-assert/archive/refs/tags/v2.2.4.tar.gz" && echo "e305df20c4c36cba4570e10f1cd824efb1ae71d88b5ef474550781ebee04192f  assert.tgz" | sha256sum -c -
          curl -fsSL -o file.tgz "https://github.com/bats-core/bats-file/archive/refs/tags/v0.4.0.tar.gz" && echo "9b69043241f3af1c2d251f89b4fcafa5df3f05e97b89db18d7c9bdf5731bb27a  file.tgz" | sha256sum -c -
          mkdir bats && tar -xzf bats.tgz --strip-components 1 -C bats && sudo ./bats/install.sh /usr/local
          for l in support assert file; do sudo mkdir -p /usr/lib/bats/bats-$l && sudo tar -xzf $l.tgz --strip-components 1 -C /usr/lib/bats/bats-$l; done
          curl -fsSL -o shellcheck.txz "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" && echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.txz" | sha256sum -c -
          tar -xJf shellcheck.txz --strip-components 1 shellcheck-v0.11.0/shellcheck
          sudo install -m 0755 shellcheck /usr/local/bin/shellcheck
          cd - > /dev/null
          rm -rf "$T"
      - name: Install dependencies
        run: |-
          export BATS_LIB_PATH="${BATS_LIB_PATH:-/usr/lib/bats}"
          mkdir -p test-reports
      - name: Unit tests
        run: |-
          export BATS_LIB_PATH="${BATS_LIB_PATH:-/usr/lib/bats}"
          T=""; for d in test tests; do if [ -d "$d" ]; then T="$T $d"; fi; done
          if [ -z "$T" ]; then echo "no bats tests"; exit 0; fi
          # shellcheck disable=SC2086
          bats --recursive --allow-empty-suite --formatter tap --report-formatter junit --output test-reports --filter-tags '!integration,!e2e' $T
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-shell
          path: test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-shell:
    name: Static analysis (shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |-
          T="$(mktemp -d)"
          cd "$T"
          curl -fsSL -o bats.tgz "https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz" && echo "bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177  bats.tgz" | sha256sum -c -
          curl -fsSL -o support.tgz "https://github.com/bats-core/bats-support/archive/refs/tags/v0.3.0.tar.gz" && echo "7815237aafeb42ddcc1b8c698fc5808026d33317d8701d5ec2396e9634e2918f  support.tgz" | sha256sum -c -
          curl -fsSL -o assert.tgz "https://github.com/bats-core/bats-assert/archive/refs/tags/v2.2.4.tar.gz" && echo "e305df20c4c36cba4570e10f1cd824efb1ae71d88b5ef474550781ebee04192f  assert.tgz" | sha256sum -c -
          curl -fsSL -o file.tgz "https://github.com/bats-core/bats-file/archive/refs/tags/v0.4.0.tar.gz" && echo "9b69043241f3af1c2d251f89b4fcafa5df3f05e97b89db18d7c9bdf5731bb27a  file.tgz" | sha256sum -c -
          mkdir bats && tar -xzf bats.tgz --strip-components 1 -C bats && sudo ./bats/install.sh /usr/local
          for l in support assert file; do sudo mkdir -p /usr/lib/bats/bats-$l && sudo tar -xzf $l.tgz --strip-components 1 -C /usr/lib/bats/bats-$l; done
          curl -fsSL -o shellcheck.txz "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" && echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.txz" | sha256sum -c -
          tar -xJf shellcheck.txz --strip-components 1 shellcheck-v0.11.0/shellcheck
          sudo install -m 0755 shellcheck /usr/local/bin/shellcheck
          cd - > /dev/null
          rm -rf "$T"
      - name: Install dependencies
        run: |-
          export BATS_LIB_PATH="${BATS_LIB_PATH:-/usr/lib/bats}"
          mkdir -p test-reports
      - name: shellcheck (lint, report only)
        run: |-
          export BATS_LIB_PATH="${BATS_LIB_PATH:-/usr/lib/bats}"
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 -r shellcheck -x -P SCRIPTDIR
        continue-on-error: true
  unit-typescript-frontend:
    name: Unit tests (typescript frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          npm ci
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
      - name: Unit tests
        run: npx vitest run --coverage --coverage.reporter=cobertura --coverage.reportsDirectory=test-reports/coverage --reporter=default --reporter=junit --outputFile.junit=test-reports/unit.xml --exclude '**/*.integration.test.*' --exclude 'e2e/**'
      - name: Coverage floor (61%)
        run: python3 "$GITHUB_WORKSPACE/ci/coverage_gate.py" cobertura 'test-reports/coverage/cobertura-coverage.xml' 61
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-typescript-frontend
          path: frontend/test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-typescript-frontend:
    name: Static analysis (typescript frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          npm ci
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
      - name: eslint (lint, report only)
        run: if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then npx eslint .; else echo 'no ESLint configuration'; fi
        continue-on-error: true
      - name: tsc (lint, report only)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: npm audit (dependency, report only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
