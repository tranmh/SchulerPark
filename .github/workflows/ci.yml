name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --warnaserror

      - name: Test
        run: dotnet test --no-build --verbosity normal

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Non-blocking for now: surface advisories without failing the pipeline.
      - name: Audit dependencies
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
          sleep 30

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/health | grep -q healthy; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "App did not become healthy"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

  deploy:
    name: Deploy to Production
    # Runs on the self-hosted runner installed on the production box itself
    # (park.schuler.de). Inbound SSH to that box is firewalled, so the previous
    # appleboy/ssh-action approach from a GitHub-hosted runner could never connect;
    # the self-hosted runner only needs outbound HTTPS to GitHub. See
    # docs/deploy-this-server.md for the runner service.
    runs-on: [self-hosted, linux, prod]
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_PATH: /home/Prache.Maurya/data/SchulerPark
    steps:
      - name: Pull master into the live checkout
        # Deliberately not actions/checkout: the prod stack runs from an existing
        # working copy that also holds the untracked .env with secrets. Fast-forward
        # only, so local uncommitted work makes the deploy fail loudly instead of
        # being discarded.
        run: |
          cd "$DEPLOY_PATH"
          git pull --ff-only origin master
          git log --oneline -1
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::warning::master moved past $GITHUB_SHA; deploying current HEAD instead"
          fi

      - name: Build and start the production stack
        run: |
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans

      - name: Health check through Caddy
        # The app port is not published on the host in prod; go through Caddy on
        # 443 (self-signed cert for now, hence -k) and bypass the corporate proxy.
        run: |
          for i in $(seq 1 30); do
            if curl -sk --noproxy '*' --max-time 5 https://localhost/api/health | grep -q healthy; then
              echo "Deploy successful: app healthy after $i attempt(s)"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 5
          done
          echo "App did not become healthy after deploy"
          docker compose -f "$DEPLOY_PATH/docker-compose.yml" -f "$DEPLOY_PATH/docker-compose.prod.yml" ps
          docker compose -f "$DEPLOY_PATH/docker-compose.yml" -f "$DEPLOY_PATH/docker-compose.prod.yml" logs --tail=100 app
          exit 1

      - name: Prune dangling images
        if: success()
        run: docker image prune -f
